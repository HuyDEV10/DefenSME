spring:
  application:
    name: defensme-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/defensme}
    username: ${DB_USERNAME:defensme}
    password: ${DB_PASSWORD:defensme-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
